[package]
name = "space-chat-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
space-chat-core = { path = "../space-chat-core" }
iroh = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"

[dev-dependencies]
tempfile = "3"
# `iroh::test_utils::run_relay_server()` (used by bootstrap.rs's real-network
# test) is only compiled in when this feature is on. Declared here rather
# than unconditionally in [dependencies] so production builds of this crate
# never pull in the relay-server/axum test scaffolding.
iroh = { version = "1", features = ["test-utils"] }
