[package]
name = "space-chat-core"
version = "0.1.0"
edition = "2021"

[dependencies]
automerge = "0.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
