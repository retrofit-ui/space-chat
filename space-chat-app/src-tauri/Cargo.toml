[package]
name = "space-chat-app"
version = "0.1.0"
description = "space-chat desktop app shell"
authors = ["space-chat"]
edition = "2021"
default-run = "space-chat-app"

[lib]
name = "space_chat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
space-chat-core = { path = "../../space-chat-core" }
space-chat-transport = { path = "../../space-chat-transport" }
space-chat-storage-files = { path = "../../space-chat-storage-files" }
space-chat-storage-redb = { path = "../../space-chat-storage-redb" }
space-chat-search-tantivy = { path = "../../space-chat-search-tantivy" }
redb = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
automerge = "0.5"
# Turns on `space-chat-transport`'s `test-utils` feature (which forwards to
# `iroh/test-utils`) for any test target in this crate, via feature
# unification, without ever enabling it for a plain `cargo build` of the
# production binary -- mirrors the same trick `space-chat-transport` uses
# on itself in its own Cargo.toml.
space-chat-transport = { path = "../../space-chat-transport", features = ["test-utils"] }
# `iroh` is only a transitive dependency via `space-chat-transport` in
# [dependencies], which is not enough for this crate's own test code to
# reference `iroh::test_utils::run_relay_server()` directly -- Rust requires
# a direct Cargo.toml edge for that. Feature unification (see above) still
# ensures this same `iroh` gets its `test-utils` feature turned on whenever
# a test target builds, so no feature list is needed here.
iroh = "1"
